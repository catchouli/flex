[workspace]
resolver = "3"
members = ["crates/*", "plugins/*"]
# Plugins are built with --workspace (CI does), so everyday builds skip Bluetooth etc.
default-members = ["crates/*"]

[workspace.package]
edition = "2024"
version = "0.6.1"
license = "MIT"

[profile.release]
strip = true

# Optimise dependencies (e.g. the filename parser) even in debug builds.
[profile.dev.package."*"]
opt-level = 2
