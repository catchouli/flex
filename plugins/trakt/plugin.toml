name = "Trakt"
description = "Keeps your Trakt history up to date with what you watch in Flex"
version = "0.16.0"
command = "flex-trakt"
subscribe = ["playback"]

[[settings]]
key = "connect"
label = "Connect to Trakt"
type = "button"
detail = "Shows a code to enter on Trakt's site on your phone"

[[settings]]
key = "scrobble"
label = "Send what I watch"
type = "bool"
detail = "Trakt marks things watched once you're 80% through"
default = true

[[settings]]
key = "disconnect"
label = "Disconnect"
type = "button"

[[settings]]
key = "client_id"
label = "Trakt app ID"
type = "text"
detail = "Only to use your own Trakt app instead of Flex's"
default = ""
