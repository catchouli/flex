[package]
name = "flex-lotus-lamp"
description = "Flex plugin: TV backlight on a Lotus Lamp (ELK-BLEDOM / MELK) Bluetooth LED strip"
edition.workspace = true
version.workspace = true
license.workspace = true
publish = false

[dependencies]
flex-plugin = { version = "0.17.0", path = "../../crates/flex-plugin" }
lotus-lamp = { git = "https://github.com/bombpersons/lotus-lamp-rs", rev = "59cf5ccaa0007f006f1812fd02cc5991aff11e72" }
tokio = { version = "1.53.2", features = ["rt", "time", "sync", "macros"] }
