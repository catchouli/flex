name = "Anime Face"
description = "Everyone gets an anime face: a smaller nose and mouth, a narrower jaw, skin evened into flat cel shading, thin arched brows that rise and frown with the real ones, and big drawn eyes in several styles (drawn from the side in profile, where the face is reshaped too), inked and shining, that blink when the real ones do, look where they look and sparkle on the beat."
suits = ["close"]
faces = true
mesh = true
audio = true
feedback = true

[[settings]]
key = "size"
label = "Size"
type = "number"
min = 100
max = 300
step = 10
unit = "%"
default = 220

[[settings]]
key = "shape"
label = "Face shape"
type = "number"
detail = "How far the nose, mouth, jaw and chin are reshaped"
min = 0
max = 100
step = 10
unit = "%"
default = 80

[[settings]]
key = "skin"
label = "Even skin"
type = "number"
min = 0
max = 100
step = 10
unit = "%"
default = 70

[[settings]]
key = "style"
label = "Eyes"
type = "choice"
detail = "To suit each face: wide-open eyes are drawn round, hooded ones sleepy or narrow, a square jaw fierce"
default = "mix"
options = [
    { id = "mix", label = "To suit each face" },
    { id = "sparkly", label = "Sparkly" },
    { id = "round", label = "Round" },
    { id = "narrow", label = "Narrow" },
    { id = "sleepy", label = "Sleepy" },
    { id = "fierce", label = "Fierce" },
]

