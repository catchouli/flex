name = "Mouth Cam"
description = "The whole screen is one mouth, close up, and it cuts to another mouth whenever someone else starts talking."
suits = ["close", "dialogue"]
faces = true
mesh = true
audio = true
feedback = true

[[settings]]
key = "fill"
label = "Fill"
type = "number"
detail = "How much of the screen's width the mouth takes up"
min = 20
max = 100
step = 5
unit = "%"
default = 75

[[settings]]
key = "hold"
label = "Hold"
type = "number"
detail = "The shortest time on one mouth before cutting to another"
min = 0
max = 4
step = 0.25
unit = " s"
default = 1

[[settings]]
key = "eager"
label = "Eagerness"
type = "number"
detail = "How little talking it takes to win the screen"
min = 20
max = 300
step = 10
unit = "%"
default = 100

[[settings]]
key = "level"
label = "Keep level"
type = "bool"
detail = "Turn the picture so the mouth stays level when a head tilts"
default = true

[[settings]]
key = "punch"
label = "Push in"
type = "number"
detail = "How much it zooms on each cut"
min = 0
max = 100
step = 10
unit = "%"
default = 50

[[settings]]
key = "flash"
label = "Flash"
type = "number"
detail = "A white flash on each cut"
min = 0
max = 100
step = 10
unit = "%"
default = 0
