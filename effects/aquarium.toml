name = "Aquarium"
description = "The room really floods: a water surface lying level with the floor or table that wraps around people and furniture, with reflections, wakes, caustics, fish, and bubbles from people's mouths."
suits = ["wide"]
depth = true
segment = true
faces = true
audio = true

[[settings]]
key = "level"
label = "Water level"
type = "number"
detail = "Past about 70, the camera is underwater too"
min = 0
max = 100
step = 5
unit = "%"
default = 30

[[settings]]
key = "rise"
label = "Time to fill"
type = "number"
min = 0
max = 60
step = 5
unit = " s"
default = 12

[[settings]]
key = "find"
label = "Level with the room"
type = "bool"
detail = "Finds the floor or a table and lies level with it, however the camera's tilted"
default = true

[[settings]]
key = "horizon"
label = "Horizon"
type = "number"
detail = "Where the water's far edge heads when no floor or table can be seen"
min = 20
max = 90
step = 5
unit = "%"
default = 60

[[settings]]
