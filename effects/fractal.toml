name = "Fractal Zoom"
description = "An endless fall into the picture, each window holding another, with the people standing in front of it."
faces = true
segment = true
audio = true

[[settings]]
key = "speed"
drift = "off"
label = "Speed"
type = "number"
min = 10
max = 300
step = 10
unit = "%"
default = 100

[[settings]]
key = "window"
label = "Window"
type = "number"
detail = "How big each picture inside the last one is"
min = 20
max = 70
step = 5
unit = "%"
default = 45

[[settings]]
key = "hue"
label = "Colour drift"
type = "number"
min = 0
max = 100
step = 10
unit = "%"
default = 30

[[settings]]
key = "people"
label = "People in front"
type = "number"
detail = "How solidly people stand in front of the window inside the picture"
min = 0
max = 100
step = 10
unit = "%"
default = 100

[[settings]]
key = "centre"
label = "Dive towards"
type = "choice"
default = "middle"
options = [
    { id = "middle", label = "The middle" },
    { id = "face", label = "The first face" },
]

[[settings]]
key = "near"
label = "Close things in front"
type = "number"
detail = "Furniture and anything else up close stands in front of the window too"
min = 0
max = 100
step = 10
unit = "%"
default = 100
