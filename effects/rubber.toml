name = "Rubber Sheet"
description = "Stretches the film over a mesh shaped by how far away everything is, then makes its vertices wobble"
audio = true
depth = true
scale = 0.75

[[settings]]
key = "style"
label = "Style"
type = "choice"
default = "waves"
options = [
    { id = "waves", label = "Waves" },
    { id = "ripple", label = "Ripples" },
    { id = "facets", label = "Facets" },
    { id = "wire", label = "Wireframe" },
]

[[settings]]
key = "cells"
label = "Mesh size"
type = "number"
detail = "Squares across the picture: fewer for chunkier"
min = 10
max = 160
step = 10
default = 120

[[settings]]
key = "wobble"
label = "Wobble"
type = "number"
min = 0
max = 100
step = 5
unit = "%"
default = 35

[[settings]]
key = "sway"
label = "Camera sway"
type = "number"
detail = "How far the view circles the mesh"
min = 0
max = 100
step = 5
unit = "%"
default = 0

[[settings]]
key = "speed"
drift = "off"
label = "Speed"
type = "number"
min = 0
max = 2
step = 0.05
unit = "×"
default = 0.3

[[settings]]
key = "react"
label = "Reacting to sound"
type = "number"
detail = "Beats and bass shake the mesh"
min = 0
max = 100
step = 20
unit = "%"
default = 0
