min = 0
max = 100
step = 10
unit = "%"
default = 50

[[settings]]
key = "notes"
label = "Music notes"
type = "number"
min = 0
max = 100
step = 10
unit = "%"
default = 70

[[settings]]
key = "look"
label = "Comic look"
type = "number"
detail = "Punchier colours and inked edges in the picture itself"
min = 0
max = 100
step = 10
unit = "%"
default = 40
