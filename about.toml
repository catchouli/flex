# cargo-about: licenses of the Rust crates compiled into Flex (Windows and Linux), bundled with releases
# (see .github/scripts/package.sh). Run: cargo about generate about.hbs
accepted = [
    "0BSD",
    "Apache-2.0",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "OFL-1.1",
    "Ubuntu-font-1.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
targets = ["x86_64-pc-windows-msvc", "x86_64-unknown-linux-gnu"]
ignore-dev-dependencies = true
ignore-build-dependencies = true
# Flex's own crates (publish = false) aren't third-party.
private = { ignore = true }
