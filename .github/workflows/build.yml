# Every pull request and push to main: build and test on Windows and Linux (flex.exe, its
# symbols and the plugins, and a Linux .tar.gz, are kept as artifacts for two weeks). Other branches
# build through their pull request (or by hand, from the Actions tab), so a branch with a
# PR isn't built twice. A vX.Y.Z tag also packages the Windows build with libmpv and
# ffmpeg, as a zip and an installer, and publishes them with the Linux .tar.gz as a
# GitHub release (see .github/scripts/package.sh, package-linux.sh and flex.iss).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Flex's patched libmpv for Linux, rebuilt only when its patches change. Pull requests skip it.
  libmpv-linux:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    container:
      image: debian:13
    steps:
      - name: What the steps below need
        run: apt-get update && apt-get install -y --no-install-recommends ca-certificates git tar zstd
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: libmpv-linux
          key: libmpv-linux-${{ hashFiles('packaging/mpv/v0.40.0/**', '.github/scripts/build-libmpv-linux.sh', '.github/scripts/bundle-libmpv-linux.sh') }}
      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash .github/scripts/build-libmpv-linux.sh libmpv-linux
      - uses: actions/upload-artifact@v4
        with:
          name: flex-libmpv-linux
          path: libmpv-linux
          retention-days: 14

  windows:
    runs-on: windows-latest
    # Keep symbols (flex.pdb, beside the exe; the exe stays the same size) so crash
    # minidumps from the TV PC can be read.
    env:
      CARGO_PROFILE_RELEASE_STRIP: "false"
      CARGO_PROFILE_RELEASE_DEBUG: line-tables-only
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --workspace: the plugins in plugins/ too.
      - name: Build
        run: cargo build --release --locked --workspace
      - name: Test
        run: cargo test --release --locked --workspace
      # The networks video effects use, which go next to flex.exe.
      - name: Models
        shell: bash
        run: mkdir -p target/release/models && cp models/*.bin models/*.safetensors target/release/models/
      - uses: actions/upload-artifact@v4
        with:
          name: flex-windows-x64
          path: |
            target/release/flex.exe
            target/release/flex.pdb
            target/release/flex-*.exe
            target/release/models/
          retention-days: 14

  linux:
    needs: [libmpv-linux]
    if: ${{ !cancelled() && !failure() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          name: flex-libmpv-linux
          path: libmpv-linux
      - name: What the build needs
        # ALSA's headers, for recording the computer's sound (cpal).
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --workspace
      - name: Test
        run: cargo test --release --locked --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Package
        run: |
          [[ -d libmpv-linux ]] && export LIBMPV_DIR=$PWD/libmpv-linux
          .github/scripts/package-linux.sh "$GITHUB_REF_NAME" target/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: flex-linux-x64
          path: dist/*.tar.gz
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flex-windows-x64
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: flex-linux-x64
          path: dist
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Install Inno Setup
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [[ -f $ISCC ]] || choco install innosetup -y --no-progress
          [[ -f $ISCC ]] || { echo "Inno Setup isn't at $ISCC"; exit 1; }
          echo "ISCC=$ISCC" >>"$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/package.sh "$GITHUB_REF_NAME" build/flex.exe dist
      - name: Package symbols
        shell: bash
        run: 7z a "dist/flex-$GITHUB_REF_NAME-symbols.zip" ./build/flex.pdb
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*-setup.exe dist/*.zip dist/*.tar.gz \
            --title "Flex $GITHUB_REF_NAME" --notes-file dist/release-notes.md --generate-notes --verify-tag
