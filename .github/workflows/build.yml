# Every push and pull request: build and test on Windows (flex.exe and the plugins are
# kept as an artifact for two weeks). A vX.Y.Z tag also packages them with libmpv and ffmpeg,
# as a zip and an installer, and publishes them as a GitHub release (see
# .github/scripts/package.sh and flex.iss).
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --workspace: the plugins in plugins/ too.
      - name: Build
        run: cargo build --release --locked --workspace
      - name: Test
        run: cargo test --release --locked --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: flex-windows-x64
          path: |
            target/release/flex.exe
            target/release/flex-*.exe
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flex-windows-x64
          path: build
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Install Inno Setup
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [[ -f $ISCC ]] || choco install innosetup -y --no-progress
          [[ -f $ISCC ]] || { echo "Inno Setup isn't at $ISCC"; exit 1; }
          echo "ISCC=$ISCC" >>"$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/package.sh "$GITHUB_REF_NAME" build/flex.exe dist
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*-setup.exe dist/*.zip \
            --title "Flex $GITHUB_REF_NAME" --notes-file dist/release-notes.md --generate-notes --verify-tag
