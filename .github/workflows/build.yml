# Every pull request and push to main: build and test on Windows and Linux (flex.exe and
# the plugins, and a Linux .tar.gz, are kept as artifacts for two weeks). Other branches
# build through their pull request (or by hand, from the Actions tab), so a branch with a
# PR isn't built twice. A vX.Y.Z tag also packages the Windows build with libmpv and
# ffmpeg, as a zip and an installer, and publishes them with the Linux .tar.gz as a
# GitHub release (see .github/scripts/package.sh, package-linux.sh and flex.iss).
name: Build

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --workspace: the plugins in plugins/ too. The Trakt plugin's app ID (and secret, for
      # an older Trakt app) come from repository secrets; without them it asks in Settings.
      - name: Build
        run: cargo build --release --locked --workspace
        env:
          FLEX_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          FLEX_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      - name: Test
        run: cargo test --release --locked --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: flex-windows-x64
          path: |
            target/release/flex.exe
            target/release/flex-*.exe
          retention-days: 14

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked --workspace
        env:
          FLEX_TRAKT_CLIENT_ID: ${{ secrets.TRAKT_CLIENT_ID }}
          FLEX_TRAKT_CLIENT_SECRET: ${{ secrets.TRAKT_CLIENT_SECRET }}
      - name: Test
        run: cargo test --release --locked --workspace
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Package
        run: .github/scripts/package-linux.sh "$GITHUB_REF_NAME" target/release dist
      - uses: actions/upload-artifact@v4
        with:
          name: flex-linux-x64
          path: dist/*.tar.gz
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, linux]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flex-windows-x64
          path: build
      - uses: actions/download-artifact@v4
        with:
          name: flex-linux-x64
          path: dist
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Install Inno Setup
        shell: bash
        run: |
          ISCC="/c/Program Files (x86)/Inno Setup 6/ISCC.exe"
          [[ -f $ISCC ]] || choco install innosetup -y --no-progress
          [[ -f $ISCC ]] || { echo "Inno Setup isn't at $ISCC"; exit 1; }
          echo "ISCC=$ISCC" >>"$GITHUB_ENV"
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/package.sh "$GITHUB_REF_NAME" build/flex.exe dist
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*-setup.exe dist/*.zip dist/*.tar.gz \
            --title "Flex $GITHUB_REF_NAME" --notes-file dist/release-notes.md --generate-notes --verify-tag
