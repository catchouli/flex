# Every push and pull request: build and test on Windows (the build is kept as an
# artifact for two weeks). A vX.Y.Z tag also packages flex.exe with libmpv and ffmpeg
# and publishes it as a GitHub release (see .github/scripts/package.sh).
name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: flex-windows-x64
          path: target/release/flex.exe
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: flex-windows-x64
          path: build
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-about
      - name: Package
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/package.sh "$GITHUB_REF_NAME" build/flex.exe dist
      - name: Publish the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Flex $GITHUB_REF_NAME" --notes-file dist/release-notes.md --generate-notes --verify-tag
