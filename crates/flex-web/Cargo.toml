[package]
name = "flex-web"
edition.workspace = true
version.workspace = true
publish = false

[dependencies]
anyhow = "1.0.104"
axum = "0.8.9"
flex-core = { version = "0.13.0", path = "../flex-core" }
log = "0.4.34"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
bytes = "1"
futures-util = "0.3.34"
tokio-util = { version = "0.7", features = ["io"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6", features = ["fs"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "net", "fs", "sync", "process", "io-util", "macros", "time"] }
ureq = "3"
